[build]
  publish = "."

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/app"
  to = "/platform.html"
  status = 200

[[redirects]]
  from = "/api/audit"
  to = "/.netlify/functions/audit"
  status = 200

[[redirects]]
  from = "/api/checkout"
  to = "/.netlify/functions/checkout"
  status = 200

[[redirects]]
  from = "/api/stripe-webhook"
  to = "/.netlify/functions/stripe-webhook"
  status = 200

[[redirects]]
  from = "/api/entitlement"
  to = "/.netlify/functions/entitlement"
  status = 200
