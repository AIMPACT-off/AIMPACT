[build]
  publish = "."

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/app"
  to = "/platform.html"
  status = 200

[[redirects]]
  from = "/payment"
  to = "/payment.html"
  status = 200

[[redirects]]
  from = "/payment-success"
  to = "/payment-success.html"
  status = 200

[[redirects]]
  from = "/payment-fail"
  to = "/payment-fail.html"
  status = 200

[[redirects]]
  from = "/api/audit"
  to = "/.netlify/functions/audit"
  status = 200

[[redirects]]
  from = "/api/checkout"
  to = "/.netlify/functions/checkout"
  status = 200

[[redirects]]
  from = "/api/stripe-webhook"
  to = "/.netlify/functions/stripe-webhook"
  status = 200

[[redirects]]
  from = "/api/toss-checkout"
  to = "/.netlify/functions/toss-checkout"
  status = 200

[[redirects]]
  from = "/api/toss-confirm"
  to = "/.netlify/functions/toss-confirm"
  status = 200

[[redirects]]
  from = "/api/toss-webhook"
  to = "/.netlify/functions/toss-webhook"
  status = 200

[[redirects]]
  from = "/api/iap-verify"
  to = "/.netlify/functions/iap-verify"
  status = 200

[[redirects]]
  from = "/api/entitlement"
  to = "/.netlify/functions/entitlement"
  status = 200
