<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AIMPACT · Secure Checkout</title>
<script src="/config.js"></script>
<script src="https://js.tosspayments.com/v2/standard"></script>
<style>
:root{color-scheme:dark;--bg:#08090b;--panel:#101216;--line:#292c33;--text:#f5f6f7;--muted:#9298a3}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Inter,system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;padding:22px}.shell{width:min(100%,520px)}.brand{font-size:13px;letter-spacing:.22em;font-weight:900;margin-bottom:32px}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:24px}.eyebrow{font-size:9px;letter-spacing:.18em;color:var(--muted);font-weight:800}.title{font-size:34px;letter-spacing:-.05em;margin:12px 0}.muted{color:var(--muted);line-height:1.6;font-size:12px}.price{font-size:30px;font-weight:900;margin:18px 0}.field{display:grid;gap:7px;margin:14px 0}.field label{font-size:9px;letter-spacing:.13em;color:var(--muted)}input{width:100%;padding:13px;background:#0b0c0f;border:1px solid var(--line);border-radius:7px;color:white}.btn{width:100%;padding:14px;border:1px solid white;background:white;color:#08090b;border-radius:7px;font-weight:900;letter-spacing:.08em;margin-top:10px;cursor:pointer}.btn:disabled{opacity:.45;cursor:not-allowed}.notice{display:none;padding:12px;border:1px solid #454b56;border-radius:8px;margin:14px 0;font-size:12px;line-height:1.5;white-space:pre-wrap}.back{display:inline-block;margin-top:20px;color:var(--muted);font-size:11px}
</style>
</head>
<body><main class="shell">
<div class="brand">AIMPACT</div>
<div class="card">
<div class="eyebrow">SECURE CHECKOUT · TOSS PAYMENTS</div>
<h1 class="title">AI Quick Audit</h1>
<p class="muted">고객 이메일 인증 후 서버에서 주문을 생성합니다. 결제 완료는 토스 승인 API와 AIMPACT 권한 원장에서 검증된 경우에만 인정됩니다.</p>
<div class="price">₩200,000 <span style="font-size:10px;font-weight:500;color:var(--muted)">일회 결제 · KRW</span></div>
<div id="notice" class="notice" role="status"></div>
<section id="auth">
<div class="field"><label for="email">EMAIL</label><input id="email" type="email" autocomplete="email" placeholder="you@company.com"></div>
<button id="send" class="btn" type="button">이메일 인증코드 받기</button>
<div id="verifyBox" hidden>
<div class="field"><label for="otp">EMAIL VERIFICATION CODE</label><input id="otp" inputmode="numeric" autocomplete="one-time-code" placeholder="이메일로 받은 코드"></div>
<button id="verify" class="btn" type="button">인증 후 결제 진행</button>
</div>
</section>
<p class="muted" style="margin-top:18px">보안을 위해 브라우저가 전달한 금액을 신뢰하지 않습니다. 서버 주문 금액은 ₩200,000으로 고정 검증됩니다.</p>
</div>
<a class="back" href="/app">← AIMPACT로 돌아가기</a>
</main>
<script>
(function(){
 const cfg=window.AIMPACT_CONFIG||{};
 const notice=document.getElementById("notice");
 const email=document.getElementById("email");
 const send=document.getElementById("send");
 const verifyBox=document.getElementById("verifyBox");
 const verify=document.getElementById("verify");
 function message(text){notice.style.display="block";notice.textContent=text}
 async function authRequest(path,body){
   if(!cfg.supabaseUrl||!cfg.supabaseKey) throw new Error("Supabase 공개 Auth 설정이 없습니다. 배포 환경의 config.js를 확인해야 합니다.");
   const r=await fetch(cfg.supabaseUrl.replace(/\/$/,"")+path,{method:"POST",headers:{apikey:cfg.supabaseKey,"Content-Type":"application/json"},body:JSON.stringify(body)});
   const data=await r.json().catch(()=>({}));
   if(!r.ok) throw new Error(data.msg||data.error_description||data.error||"이메일 인증 요청에 실패했습니다.");
   return data;
 }
 send.onclick=async()=>{
   send.disabled=true;
   try{await authRequest("/auth/v1/otp",{email:email.value.trim().toLowerCase(),create_user:true});verifyBox.hidden=false;message("인증코드를 이메일로 전송했습니다.");}
   catch(e){message(e.message);}
   finally{send.disabled=false;}
 };
 verify.onclick=async()=>{
   verify.disabled=true;
   try{
     const session=await authRequest("/auth/v1/verify",{email:email.value.trim().toLowerCase(),token:document.getElementById("otp").value.trim(),type:"email"});
     const token=String(session.access_token||"");
     if(!token) throw new Error("인증 세션이 발급되지 않았습니다.");
     sessionStorage.setItem("aimpact_access_token",token);
     message("인증 완료. 서버 주문을 생성하고 토스 결제창을 연결합니다.");
     const r=await fetch("/api/toss-checkout",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+token},body:JSON.stringify({productKey:"AI_QUICK_AUDIT",amount:200000})});
     const order=await r.json().catch(()=>({}));
     if(!r.ok||!order.orderId||!order.clientKey) throw new Error(order.error||"결제 주문을 생성하지 못했습니다. 결제 서버 설정과 DB 마이그레이션을 확인해야 합니다.");
     const tossPayments=TossPayments(order.clientKey);
     const payment=tossPayments.payment({customerKey:order.customerKey});
     await payment.requestPayment({method:"CARD",amount:{currency:"KRW",value:order.amount},orderId:order.orderId,orderName:order.orderName,successUrl:order.successUrl,failUrl:order.failUrl});
   }catch(e){message(e.message||"결제를 시작하지 못했습니다.");}
   finally{verify.disabled=false;}
 };
})();
</script>
</body></html>
