name: Phase 1 unit tests
on:
  push:
    paths: ["package.json","server/**","lib/**","scripts/**","tests/**",".github/workflows/phase1-tests.yml","supabase/migrations/**"]
  pull_request:
    paths: ["package.json","server/**","lib/**","scripts/**","tests/**",".github/workflows/phase1-tests.yml","supabase/migrations/**"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Syntax check
        run: |
          node --check server/dispatcher.mjs
          node --check server/mock-worker.mjs
          node --check server/persistent-stores.mjs
          node --check server/control-plane.mjs
          node --check server/audit-pipeline.mjs
          node --check lib/live-handshake.mjs
          node --check lib/circuit-breaker.mjs
          node --check lib/model-router.mjs
          node --check lib/tenant-rate-limiter.mjs
          node --check lib/audit-roi.mjs
          node --check lib/audit-anchor.mjs
          node --check lib/decision-guard.mjs
          node --check lib/idempotency-saga.mjs
          node --check lib/audit-input-guard.mjs
          node --check scripts/check-provider-env.mjs
          node --check scripts/test-tenant-isolation.mjs
          node --check scripts/lint-migrations.mjs
      - name: Migration safety lint
        run: node scripts/lint-migrations.mjs
      - name: Dispatcher integration tests
        run: npm run test:dispatcher
      - name: LIVE handshake tests
        run: node --test tests/live-handshake.test.mjs
      - name: Tenant isolation CLI safety test
        run: node --test tests/tenant-isolation-cli.test.mjs
      - name: Audit Bot dispatcher handshake contract
        run: npm run test:audit-dispatcher-handshake
      - name: Audit Bot E2E and Phase 3 safety tests
        run: npm run test:audit-e2e
      - name: Korean PDF font embedding test
        run: npm run test:pdf-korean-rendering
      - name: Production preflight dry-run
        run: npm run test:production-preflight
      - name: Full unit tests
        run: npm test
