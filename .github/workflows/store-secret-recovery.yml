name: AIMPACT Store Secret Recovery

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/store-secret-recovery.yml"
      - "tests/store-secret-readiness-watch.test.mjs"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/store-secret-recovery.yml"
      - "tests/store-secret-readiness-watch.test.mjs"

permissions:
  contents: write
  actions: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test fail-closed store recovery policy
        run: node --test tests/store-secret-readiness-watch.test.mjs

  recover-store-qa:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    needs: [validate]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      APPLE_ISSUER_ID: ${{ secrets.APPLE_ISSUER_ID }}
      APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
      APPLE_PRIVATE_KEY: ${{ secrets.APPLE_PRIVATE_KEY }}
      APPLE_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_PRIVATE_KEY_BASE64 }}
      APPLE_BUNDLE_ID: ${{ secrets.APPLE_BUNDLE_ID }}
      GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
      GOOGLE_SERVICE_ACCOUNT_KEY_BASE64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY_BASE64 }}
      GOOGLE_PACKAGE_NAME: ${{ secrets.GOOGLE_PACKAGE_NAME }}
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Check credential presence without exposing secret values
        id: readiness
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in APPLE_ISSUER_ID APPLE_KEY_ID APPLE_BUNDLE_ID GOOGLE_SERVICE_ACCOUNT_EMAIL GOOGLE_PACKAGE_NAME EXPO_TOKEN GOOGLE_SERVICE_ACCOUNT_KEY_BASE64; do
            if [ -n "${!name:-}" ]; then
              echo "$name=CONFIGURED"
            else
              echo "$name=MISSING"
              missing=1
            fi
          done
          if [ -n "${APPLE_PRIVATE_KEY:-}" ] || [ -n "${APPLE_PRIVATE_KEY_BASE64:-}" ]; then
            echo "APPLE_PRIVATE_KEY=CONFIGURED"
          else
            echo "APPLE_PRIVATE_KEY=MISSING"
            missing=1
          fi
          if [ "$missing" -eq 0 ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "STORE_CREDENTIAL_READINESS=PASS"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "STORE_CREDENTIAL_READINESS=BLOCKED"
          fi
      - name: Select latest successful main mobile build and verify its release gate
        if: ${{ steps.readiness.outputs.ready == 'true' }}
        id: source
        shell: bash
        run: |
          set -euo pipefail
          RUN_JSON="$(gh run list --workflow "AIMPACT Mobile Build" --branch main --status success --limit 1 --json databaseId,headSha,headBranch,conclusion)"
          RUN_ID="$(printf '%s' "$RUN_JSON" | jq -r '.[0].databaseId // empty')"
          SHA="$(printf '%s' "$RUN_JSON" | jq -r '.[0].headSha // empty')"
          BRANCH="$(printf '%s' "$RUN_JSON" | jq -r '.[0].headBranch // empty')"
          [ -n "$RUN_ID" ] && [ -n "$SHA" ] && [ "$BRANCH" = "main" ] || { echo "STORE_RECOVERY=BLOCKED_NO_SUCCESSFUL_MAIN_MOBILE_BUILD"; exit 0; }
          RUN="$(gh run view "$RUN_ID" --json conclusion,headSha,headBranch,workflowName,jobs)"
          [ "$(printf '%s' "$RUN" | jq -r '.workflowName')" = "AIMPACT Mobile Build" ] || { echo "STORE_RECOVERY=BLOCKED_WRONG_WORKFLOW"; exit 1; }
          [ "$(printf '%s' "$RUN" | jq -r '.conclusion')" = "success" ] || { echo "STORE_RECOVERY=BLOCKED_MOBILE_BUILD_NOT_SUCCESSFUL"; exit 0; }
          for job in android-apk android-runtime ios-simulator mobile-release-gate; do
            result="$(printf '%s' "$RUN" | jq -r --arg n "$job" '.jobs[] | select(.name==$n) | .conclusion' | head -n 1)"
            [ "$result" = "success" ] || { echo "STORE_RECOVERY=BLOCKED_MOBILE_GATE_$job"; exit 0; }
          done
          git cat-file -e "$SHA^{commit}"
          git merge-base --is-ancestor "$SHA" origin/main || { echo "STORE_RECOVERY=BLOCKED_SHA_NOT_ON_MAIN"; exit 1; }
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "STORE_RECOVERY_SOURCE=PASS RUN=$RUN_ID SHA=$SHA"
      - name: Avoid duplicate QA and retry only credential-blocked attempts
        if: ${{ steps.readiness.outputs.ready == 'true' && steps.source.outputs.sha != '' }}
        id: qa
        shell: bash
        env:
          MOBILE_RUN_ID: ${{ steps.source.outputs.run_id }}
          MOBILE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          QA_JSON="$(gh run list --workflow "AIMPACT Native Store QA" --limit 50 --json databaseId,headSha,conclusion,status,createdAt)"
          MATCH="$(printf '%s' "$QA_JSON" | jq -c --arg sha "$MOBILE_SHA" '[.[] | select(.headSha==$sha)] | sort_by(.createdAt) | last // empty')"
          if [ -n "$MATCH" ]; then
            QA_ID="$(printf '%s' "$MATCH" | jq -r '.databaseId')"
            QA_STATUS="$(printf '%s' "$MATCH" | jq -r '.status')"
            QA_CONCLUSION="$(printf '%s' "$MATCH" | jq -r '.conclusion // empty')"
            if [ "$QA_STATUS" = "in_progress" ] || [ "$QA_STATUS" = "queued" ] || [ "$QA_CONCLUSION" = "success" ]; then
              echo "STORE_QA_RECOVERY=NOT_NEEDED RUN=$QA_ID STATUS=$QA_STATUS CONCLUSION=${QA_CONCLUSION:-PENDING}"
              exit 0
            fi
            if [ "$QA_CONCLUSION" = "failure" ]; then
              QA_LOG="$(gh run view "$QA_ID" --log 2>/dev/null || true)"
              if ! printf '%s' "$QA_LOG" | grep -Eq 'STORE_PRODUCT_VERIFICATION=BLOCKED_CREDENTIALS|STORE_RELEASE_BLOCKED_CREDENTIALS'; then
                echo "STORE_QA_RECOVERY=BLOCKED_PREVIOUS_FAILURE_NOT_CREDENTIAL_BLOCKED RUN=$QA_ID"
                exit 0
              fi
              echo "STORE_QA_RECOVERY=RETRYING_PREVIOUS_CREDENTIAL_BLOCK RUN=$QA_ID"
            fi
          fi
          echo "dispatch=true" >> "$GITHUB_OUTPUT"
      - name: Pin immutable source and dispatch Native Store QA
        if: ${{ steps.readiness.outputs.ready == 'true' && steps.source.outputs.sha != '' && steps.qa.outputs.dispatch == 'true' }}
        shell: bash
        env:
          MOBILE_RUN_ID: ${{ steps.source.outputs.run_id }}
          MOBILE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          SOURCE_REF="ci/mobile-$MOBILE_RUN_ID"
          EXISTING_TAG_SHA="$(git ls-remote origin "refs/tags/$SOURCE_REF" | awk 'NR==1{print $1}')"
          if [ -n "$EXISTING_TAG_SHA" ]; then
            [ "$EXISTING_TAG_SHA" = "$MOBILE_SHA" ] || { echo "::error::IMMUTABLE_RELEASE_TAG_SHA_MISMATCH"; exit 1; }
          else
            git tag "$SOURCE_REF" "$MOBILE_SHA"
            git push origin "refs/tags/$SOURCE_REF"
          fi
          gh workflow run native-store-qa.yml --ref "$SOURCE_REF" -f mobile_run_id="$MOBILE_RUN_ID" -f mobile_head_sha="$MOBILE_SHA" -f source_ref="$SOURCE_REF"
          echo "STORE_QA_RECOVERY=DISPATCHED MOBILE_RUN_ID=$MOBILE_RUN_ID SHA=$MOBILE_SHA SOURCE_REF=$SOURCE_REF"
