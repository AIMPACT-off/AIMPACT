name: AIMPACT Web Verification

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify customer platform
        run: |
          test -f platform.html
          test -f netlify.toml
          node --check scripts/production-env-checklist.mjs
          node --test tests/audit-pipeline.test.mjs
      - name: Verify no demo KPI literals
        run: |
          ! grep -q '2.4×' platform.html
          ! grep -q '<b>78</b>' platform.html
          ! grep -q '<b>184</b>' platform.html
