name: AIMPACT Web Verification

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: aimpact-web-verification
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Node dependencies
        run: npm install --no-audit --no-fund
      - name: Verify customer platform
        run: |
          test -f platform.html
          test -f netlify.toml
          test -f netlify/functions/stripe-webhook.mjs
          node --check scripts/production-env-checklist.mjs
          node --test tests/audit-pipeline.test.mjs
          node --test tests/stripe-webhook.test.mjs
      - name: Verify no demo KPI literals
        run: |
          ! grep -q '2.4×' platform.html
          ! grep -q '<b>78</b>' platform.html
          ! grep -q '<b>184</b>' platform.html
