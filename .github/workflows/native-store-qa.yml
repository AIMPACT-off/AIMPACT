name: AIMPACT Native Store QA

on:
  workflow_dispatch:
    inputs:
      mobile_run_id:
        description: "Successful AIMPACT Mobile Build run ID dispatched by Central Control"
        required: true
        type: string
      mobile_head_sha:
        description: "Commit SHA verified by Central Control"
        required: true
        type: string

concurrency:
  group: aimpact-native-store-qa
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  store-configuration-and-product-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify originating mobile build gate
        env:
          GH_TOKEN: ${{ github.token }}
          MOBILE_RUN_ID: ${{ inputs.mobile_run_id }}
          MOBILE_HEAD_SHA: ${{ inputs.mobile_head_sha }}
        run: |
          set -euo pipefail
          test -n "$MOBILE_RUN_ID" || { echo "::error::MOBILE_BUILD_RUN_ID_REQUIRED"; exit 1; }
          test -n "$MOBILE_HEAD_SHA" || { echo "::error::MOBILE_BUILD_SHA_REQUIRED"; exit 1; }
          RUN="$(gh run view "$MOBILE_RUN_ID" --json conclusion,headSha,workflowName,jobs)"
          test "$(printf '%s' "$RUN" | jq -r '.workflowName')" = "AIMPACT Mobile Build" || { echo "::error::MOBILE_BUILD_WORKFLOW_MISMATCH"; exit 1; }
          test "$(printf '%s' "$RUN" | jq -r '.headSha')" = "$MOBILE_HEAD_SHA" || { echo "::error::MOBILE_BUILD_SHA_MISMATCH"; exit 1; }
          test "$(printf '%s' "$RUN" | jq -r '.conclusion')" = "success" || { echo "::error::MOBILE_BUILD_NOT_SUCCESSFUL"; exit 1; }
          for job in android-apk android-runtime ios-simulator; do
            result="$(printf '%s' "$RUN" | jq -r --arg n "$job" '.jobs[] | select(.name==$n) | .conclusion' | head -n 1)"
            test "$result" = "success" || { echo "::error::MOBILE_JOB_GATE_FAILED_$job"; exit 1; }
          done
          echo "MOBILE_BUILD_GATE=PASS RUN=$MOBILE_RUN_ID SHA=$MOBILE_HEAD_SHA"
      - name: Validate native store architecture
        run: |
          set -euo pipefail
          grep -q '"expo-iap"' mobile/package.json
          grep -q 'expo-iap' mobile/app.json
          test -s netlify/functions/iap-verify.mjs
          test -s supabase/migrations/202610080003_store_entitlements.sql
          grep -q 'APPLE_ISSUER_ID' netlify/functions/iap-verify.mjs
          grep -q 'GOOGLE_SERVICE_ACCOUNT_EMAIL' netlify/functions/iap-verify.mjs
          echo "NATIVE_STORE_ARCHITECTURE=PASS"
      - name: Audit Apple and Google verification credentials
        id: store-credentials
        env:
          APPLE_ISSUER_ID: ${{ secrets.APPLE_ISSUER_ID }}
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APPLE_PRIVATE_KEY: ${{ secrets.APPLE_PRIVATE_KEY }}
          APPLE_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_PRIVATE_KEY_BASE64 }}
          APPLE_BUNDLE_ID: ${{ secrets.APPLE_BUNDLE_ID }}
          GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
          GOOGLE_SERVICE_ACCOUNT_KEY_BASE64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY_BASE64 }}
          GOOGLE_PACKAGE_NAME: ${{ secrets.GOOGLE_PACKAGE_NAME }}
        run: |
          set -euo pipefail
          missing=0
          for v in APPLE_ISSUER_ID APPLE_KEY_ID APPLE_BUNDLE_ID GOOGLE_SERVICE_ACCOUNT_EMAIL GOOGLE_PACKAGE_NAME; do
            if test -n "${!v}"; then echo "${v}=CONFIGURED"; else echo "${v}=MISSING"; missing=1; fi
          done
          if test -n "${APPLE_PRIVATE_KEY_BASE64}" || test -n "${APPLE_PRIVATE_KEY}"; then echo "APPLE_PRIVATE_KEY=CONFIGURED"; else echo "APPLE_PRIVATE_KEY=MISSING"; missing=1; fi
          if test -n "${GOOGLE_SERVICE_ACCOUNT_KEY_BASE64}"; then echo "GOOGLE_SERVICE_ACCOUNT_KEY_BASE64=CONFIGURED"; else echo "GOOGLE_SERVICE_ACCOUNT_KEY_BASE64=MISSING"; missing=1; fi
          if test "$missing" -eq 0; then
            echo "STORE_VERIFICATION_CREDENTIALS=CONFIGURED" >> "$GITHUB_OUTPUT"
          else
            echo "STORE_VERIFICATION_CREDENTIALS=INCOMPLETE" >> "$GITHUB_OUTPUT"
            echo "STORE_PRODUCT_VERIFICATION=BLOCKED_CREDENTIALS"
          fi
      - name: Verify Apple IAP product exists
        if: ${{ steps.store-credentials.outputs.STORE_VERIFICATION_CREDENTIALS == 'CONFIGURED' }}
        env:
          APPLE_ISSUER_ID: ${{ secrets.APPLE_ISSUER_ID }}
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APPLE_PRIVATE_KEY: ${{ secrets.APPLE_PRIVATE_KEY }}
          APPLE_BUNDLE_ID: ${{ secrets.APPLE_BUNDLE_ID }}
          IAP_PRODUCT_ID: ai.aimpact.quick_audit
        run: |
          node <<'NODE'
          const crypto=require("crypto");
          const b64=v=>Buffer.from(v).toString("base64url");
          const now=Math.floor(Date.now()/1000);
          const h=b64(JSON.stringify({alg:"ES256",kid:process.env.APPLE_KEY_ID,typ:"JWT"}));
          const p=b64(JSON.stringify({iss:process.env.APPLE_ISSUER_ID,iat:now,exp:now+300,aud:"appstoreconnect-v1"}));
          const sig=crypto.sign("sha256",Buffer.from(h+"."+p),{key:process.env.APPLE_PRIVATE_KEY.replace(/\\n/g,"\n"),dsaEncoding:"ieee-p1363"}).toString("base64url");
          const jwt=h+"."+p+"."+sig;
          (async()=>{
            const a=await fetch("https://api.appstoreconnect.apple.com/v1/apps?filter[bundleId]="+encodeURIComponent(process.env.APPLE_BUNDLE_ID),{headers:{Authorization:"Bearer "+jwt}});
            if(!a.ok) throw new Error("APPLE_APP_LOOKUP_HTTP_"+a.status);
            const ad=await a.json(); const app=ad.data?.[0]; if(!app) throw new Error("APPLE_APP_NOT_FOUND");
            const u="https://api.appstoreconnect.apple.com/v1/apps/"+app.id+"/inAppPurchasesV2?filter[productId]="+encodeURIComponent(process.env.IAP_PRODUCT_ID)+"&limit=1";
            const r=await fetch(u,{headers:{Authorization:"Bearer "+jwt}});
            if(!r.ok) throw new Error("APPLE_IAP_LOOKUP_HTTP_"+r.status);
            const d=await r.json(); const item=d.data?.[0]; if(!item) throw new Error("APPLE_IAP_PRODUCT_NOT_FOUND");
            console.log("APPLE_IAP_PRODUCT=PASS",JSON.stringify({id:item.id,productId:item.attributes?.productId,state:item.attributes?.state}));
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Verify Google Play one-time product exists
        if: ${{ steps.store-credentials.outputs.STORE_VERIFICATION_CREDENTIALS == 'CONFIGURED' }}
        env:
          GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
          GOOGLE_SERVICE_ACCOUNT_KEY_BASE64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY_BASE64 }}
          GOOGLE_PACKAGE_NAME: ${{ secrets.GOOGLE_PACKAGE_NAME }}
          IAP_PRODUCT_ID: ai.aimpact.quick_audit
        run: |
          node <<'NODE'
          const crypto=require("crypto");
          const sa=JSON.parse(Buffer.from(process.env.GOOGLE_SERVICE_ACCOUNT_KEY_BASE64,"base64").toString("utf8"));
          if(sa.client_email!==process.env.GOOGLE_SERVICE_ACCOUNT_EMAIL) throw new Error("GOOGLE_SERVICE_ACCOUNT_EMAIL_MISMATCH");
          const b64=v=>Buffer.from(v).toString("base64url");
          const now=Math.floor(Date.now()/1000);
          const h=b64(JSON.stringify({alg:"RS256",typ:"JWT"}));
          const p=b64(JSON.stringify({iss:sa.client_email,scope:"https://www.googleapis.com/auth/androidpublisher",aud:"https://oauth2.googleapis.com/token",iat:now,exp:now+3600}));
          const sig=crypto.createSign("RSA-SHA256").update(h+"."+p).sign(sa.private_key).toString("base64url");
          (async()=>{
            const t=await fetch("https://oauth2.googleapis.com/token",{method:"POST",headers:{"content-type":"application/x-www-form-urlencoded"},body:new URLSearchParams({grant_type:"urn:ietf:params:oauth:grant-type:jwt-bearer",assertion:h+"."+p+"."+sig})});
            if(!t.ok) throw new Error("GOOGLE_OAUTH_HTTP_"+t.status);
            const td=await t.json(); if(!td.access_token) throw new Error("GOOGLE_ACCESS_TOKEN_MISSING");
            const u="https://androidpublisher.googleapis.com/androidpublisher/v3/applications/"+encodeURIComponent(process.env.GOOGLE_PACKAGE_NAME)+"/oneTimeProducts/"+encodeURIComponent(process.env.IAP_PRODUCT_ID);
            const r=await fetch(u,{headers:{Authorization:"Bearer "+td.access_token}});
            if(!r.ok) throw new Error("GOOGLE_IAP_LOOKUP_HTTP_"+r.status);
            const d=await r.json(); if(d.productId!==process.env.IAP_PRODUCT_ID) throw new Error("GOOGLE_IAP_PRODUCT_MISMATCH");
            console.log("GOOGLE_IAP_PRODUCT=PASS",JSON.stringify({productId:d.productId,purchaseOptions:d.purchaseOptions?.length||0}));
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Enforce store credential gate
        env:
          STORE_CREDENTIALS: ${{ steps.store-credentials.outputs.STORE_VERIFICATION_CREDENTIALS }}
        run: |
          set -euo pipefail
          test "$STORE_CREDENTIALS" = "CONFIGURED" || { echo "::error::STORE_RELEASE_BLOCKED_CREDENTIALS"; exit 1; }
          echo "NATIVE_STORE_ARCHITECTURE_GATE=PASS"
          echo "STORE_PRODUCT_VERIFICATION=PASS"

  auto-next-store-builds:
    if: ${{ success() }}
    needs: [store-configuration-and-product-gate]
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Checkout repository for GitHub CLI workflow dispatch
        uses: actions/checkout@v4
      - name: Dispatch web verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run web-verification.yml --ref main
      - name: Dispatch iOS TestFlight build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ios-device-release.yml --ref main
      - name: Dispatch Android Internal Testing build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run android-store-release.yml --ref main
