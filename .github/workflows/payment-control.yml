name: AIMPACT Payment Control
'on':
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_run:
    workflows: ["AIMPACT Mobile Build"]
    types: [completed]
  schedule:
    - cron: "7 * * * *"
    - cron: "37 * * * *"
  workflow_dispatch:
concurrency:
  group: aimpact-payment-control-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
jobs:
  payment-code-gate:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate automated payment control code
        run: |
          set -euo pipefail
          node control-plane/payment-control.mjs
          grep -q 'STRIPE_SECRET_KEY' netlify/functions/checkout.mjs
          grep -q 'payment_status' netlify/functions/stripe-webhook.mjs
          grep -q 'PRODUCT_PRICE_QUICK_AUDIT' netlify/functions/stripe-webhook.mjs
          grep -q 'CHECKOUT_PRICE_MISMATCH' netlify/functions/checkout.mjs
          test -s netlify/functions/toss-checkout.mjs
          test -s netlify/functions/toss-confirm.mjs
          test -s netlify/functions/toss-webhook.mjs
          test -s supabase/migrations/202610090001_toss_payment_orders.sql
          node --check netlify/functions/stripe-webhook.mjs
          node --check netlify/functions/checkout.mjs
          node --check netlify/functions/toss-checkout.mjs
          node --check netlify/functions/toss-confirm.mjs
          node --check netlify/functions/toss-webhook.mjs
          node --check netlify/functions/entitlement.mjs
          node --test tests/toss-payment.test.mjs
          grep -q '=== "paid"' netlify/functions/stripe-webhook.mjs
          grep -q 'verifyPaidEntitlement' mobile/App.js
          echo "PAYMENT_CODE_GATE=PASS"

  stripe-integration-gate:
    if: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')) }}
    needs: [payment-code-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Select configured provider without treating key presence as integration proof
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          TOSS_SECRET_KEY: ${{ secrets.TOSS_SECRET_KEY }}
          PAYMENT_PROVIDER: ${{ vars.AIMPACT_PAYMENT_PROVIDER }}
          PAYMENT_LINK_ID: plink_1UNpJEGeNSkj4zfGecYTrM3u
        shell: bash
        run: |
          set -euo pipefail
          provider="${PAYMENT_PROVIDER:-auto}"
          if [ "$provider" = "auto" ]; then
            if [ -n "${TOSS_SECRET_KEY:-}" ]; then provider="toss"; elif [ -n "${STRIPE_SECRET_KEY:-}" ]; then provider="stripe"; else provider="mock"; fi
          fi
          echo "PAYMENT_PROVIDER_SELECTED=$provider"
          if [ "$provider" = "mock" ]; then
            echo "::warning::No payment provider credentials configured; only code-level checks ran. No live/sandbox payment integration is verified."
            echo "::warning::STRIPE_SECRET_KEY_NOT_CONFIGURED"
            echo "PAYMENT_PROVIDER_GATE_MODE=MOCK_ONLY"
            echo "STRIPE_INTEGRATION_GATE=SKIPPED_NO_PROVIDER_SECRET"
            echo "PAYMENT_E2E=NOT_VERIFIED"
            exit 0
          fi
          if [ "$provider" = "toss" ]; then
            : "${TOSS_SECRET_KEY:?TOSS_SECRET_KEY_NOT_CONFIGURED}"
            : "${TOSS_CLIENT_KEY:?TOSS_CLIENT_KEY_NOT_CONFIGURED}"
            : "${SUPABASE_URL:?SUPABASE_URL_NOT_CONFIGURED}"
            : "${SUPABASE_SERVICE_ROLE_KEY:?SUPABASE_SERVICE_ROLE_KEY_NOT_CONFIGURED}"
            if [[ "$TOSS_SECRET_KEY" != test_sk_* && "$TOSS_SECRET_KEY" != test_gsk_* ]]; then
              echo "::error::TOSS_SECRET_KEY_NOT_A_TEST_KEY"
              echo "TOSS_SANDBOX_PREFLIGHT=FAIL"
              echo "PAYMENT_E2E=NOT_VERIFIED"
              exit 1
            fi
            if [[ "$TOSS_CLIENT_KEY" != test_ck_* && "$TOSS_CLIENT_KEY" != test_gck_* ]]; then
              echo "::error::TOSS_CLIENT_KEY_NOT_A_TEST_KEY"
              echo "TOSS_SANDBOX_PREFLIGHT=FAIL"
              echo "PAYMENT_E2E=NOT_VERIFIED"
              exit 1
            fi
            if [ ! -s netlify/functions/toss-checkout.mjs ] || [ ! -s netlify/functions/toss-confirm.mjs ] || [ ! -s netlify/functions/toss-webhook.mjs ]; then
              echo "::error::TOSS_INTEGRATION_CODE_MISSING"
              echo "TOSS_SANDBOX_PREFLIGHT=FAIL"
              echo "PAYMENT_E2E=NOT_VERIFIED"
              exit 1
            fi
            supabase_url="${SUPABASE_URL%/}"
            code=$(curl -sS -o /tmp/toss-ledger-preflight.json -w "%{http_code}" \
              -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
              "$supabase_url/rest/v1/toss_payment_orders?select=order_id&limit=0" || true)
            if [ "$code" != "200" ]; then
              echo "::error::SUPABASE_TOSS_LEDGER_PREFLIGHT_FAILED HTTP=$code"
              echo "TOSS_SANDBOX_PREFLIGHT=FAIL"
              echo "PAYMENT_E2E=NOT_VERIFIED"
              exit 1
            fi
            echo "TOSS_TEST_KEY_FORMAT=PASS"
            echo "SUPABASE_TOSS_LEDGER_ACCESS=PASS"
            echo "TOSS_SANDBOX_PREFLIGHT=PASS"
            echo "::notice::Preflight only. This does not run a real sandbox checkout or prove payment approval, ledger mutation, entitlement issuance, or idempotency."
            echo "PAYMENT_E2E=NOT_VERIFIED"
            exit 0
          fi
          if [ "$provider" != "stripe" ]; then
            echo "::error::UNSUPPORTED_PAYMENT_PROVIDER=$provider"
            exit 1
          fi
          if [ -z "${STRIPE_SECRET_KEY:-}" ]; then
            echo "::error::STRIPE_SECRET_KEY_NOT_CONFIGURED"
            exit 1
          fi
          for attempt in 1 2 3; do
            code=$(curl -sS -o /tmp/payment-link.json -w "%{http_code}" -u "$STRIPE_SECRET_KEY:" "https://api.stripe.com/v1/payment_links/$PAYMENT_LINK_ID" || true)
            if [ "$code" = "200" ]; then break; fi
            echo "STRIPE_PAYMENT_LINK_OBSERVATION_RETRY=$attempt HTTP=$code"
            sleep $((attempt * 5))
          done
          test "$code" = "200" || { echo "::error::STRIPE_PAYMENT_LINK_API_UNVERIFIED"; exit 1; }
          python - <<'PY'
          import json
          d=json.load(open('/tmp/payment-link.json'))
          assert d.get('active') is True, 'payment link is not active'
          assert d.get('livemode') is False, 'expected sandbox payment link'
          print('STRIPE_SANDBOX_PAYMENT_LINK=PASS')
          print('PAYMENT_PROVIDER_GATE_MODE=STRIPE_SANDBOX_VERIFIED')
          print('STRIPE_INTEGRATION_GATE=PASS')
          print('PAYMENT_E2E=NOT_VERIFIED')
          PY
