name: AIMPACT Central Control Validation

'on':
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ["AIMPACT Mobile Build", "AIMPACT Payment Control"]
    branches: [main]
    types: [completed]
  schedule:
    - cron: "*/30 * * * *"

concurrency:
  group: aimpact-central-control-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  automation-watchdog:
    if: ${{ github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Watch active automation runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          now=$(date +%s)
          for workflow in "AIMPACT Mobile Build" "AIMPACT Payment Control"; do
            run_json="$(gh run list --workflow "$workflow" --branch main --status in_progress --limit 1 --json databaseId,createdAt,updatedAt 2>/dev/null || echo '[]')"
            run_id="$(printf '%s' "$run_json" | jq -r '.[0].databaseId // empty')"
            created="$(printf '%s' "$run_json" | jq -r '.[0].createdAt // empty')"
            [ -n "$run_id" ] || continue
            started=$(date -d "$created" +%s)
            age=$((now-started))
            echo "$workflow RUN=$run_id AGE_SECONDS=$age"
            if [ "$age" -gt 2400 ]; then
              echo "WATCHDOG_ACTION=cancel_and_rerun RUN=$run_id"
              gh run cancel "$run_id" || true
              sleep 5
              gh run rerun "$run_id" --failed || gh run rerun "$run_id"
            fi
          done

  control-plane:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate central-control policy
        run: node control-plane/validate-policy.mjs
      - name: Enforce Android diagnostics and store release gates
        shell: bash
        run: |
          set -euo pipefail
          bash -n mobile/scripts/android-runtime-check.sh
          grep -Fq 'bash mobile/scripts/android-runtime-check.sh' .github/workflows/mobile-build.yml
          grep -Fq 'actions/download-artifact@v4' .github/workflows/mobile-build.yml
          grep -Fq 'sha256sum -c "$(basename "$APK").sha256"' .github/workflows/mobile-build.yml
          grep -Fq 'AIMPACT-Android-Runtime-Diagnostics' .github/workflows/mobile-build.yml
          grep -Fq 'cancel-in-progress: false' .github/workflows/mobile-build.yml
          grep -Fq 'mobile-release-gate:' .github/workflows/mobile-build.yml
          grep -Fq 'needs.android-apk.result' .github/workflows/mobile-build.yml
          grep -Fq 'needs.android-runtime.result' .github/workflows/mobile-build.yml
          grep -Fq 'needs.ios-simulator.result' .github/workflows/mobile-build.yml
          grep -Fq 'AIMPACT_MOBILE_RELEASE_GATE=PASS' .github/workflows/mobile-build.yml
          for f in .github/workflows/android-store-release.yml .github/workflows/ios-device-release.yml; do
            ! grep -q 'workflow_run:' "$f"
            grep -q 'store_qa_run_id' "$f"
            grep -q 'STORE_QA_NOT_SUCCESSFUL' "$f"
            grep -q 'MOBILE_BUILD_NOT_SUCCESSFUL' "$f"
          done
          grep -q 'EAS_PROJECT_ID_NOT_CONFIGURED' .github/workflows/native-store-qa.yml
          grep -q 'EAS_PROJECT_ID_NOT_CONFIGURED' .github/workflows/android-store-release.yml
          grep -q 'EXPO_TOKEN; do' .github/workflows/native-store-qa.yml
          grep -q 'store_qa_run_id="$GITHUB_RUN_ID"' .github/workflows/native-store-qa.yml
          grep -q 'stripe-integration-gate:' .github/workflows/payment-control.yml
          grep -q 'STRIPE_SECRET_KEY_NOT_CONFIGURED' .github/workflows/payment-control.yml
          grep -q 'PAYMENT_PROVIDER_GATE_MODE=MOCK_ONLY' .github/workflows/payment-control.yml
          grep -q 'TOSS_SANDBOX_PAYMENT_TEST_NOT_IMPLEMENTED' .github/workflows/payment-control.yml
          test -s netlify/functions/toss-checkout.mjs
          test -s netlify/functions/toss-confirm.mjs
          test -s netlify/functions/toss-webhook.mjs
          grep -q 'PRODUCT_PRICE_QUICK_AUDIT' netlify/functions/toss-confirm.mjs
          ! grep -q 'native-store-qa.yml' .github/workflows/payment-control.yml
          echo "ANDROID_DIAGNOSTICS_AND_RELEASE_GATES=PASS"

      - name: Validate required company architecture
        shell: bash
        run: |
          set -euo pipefail
          required=(AIMPACT_CENTRAL_CONTROL_SYSTEM.md AIMPACT_DECISION_AUTHORITY.md AIMPACT_CORE_TECHNOLOGY_AND_MONETIZATION.md AIMPACT_DATA_LINEAGE.md AIMPACT_VERIFICATION_SPEC.md AIMPACT_SYNC_SPEC.md)
          for f in "${required[@]}"; do test -s "$f" || { echo "Missing required architecture artifact: $f"; exit 1; }; done
      - name: Validate frontend JavaScript syntax
        run: |
          node --check app.js
          node --check config.js
      - name: Block browser service-role exposure
        shell: bash
        run: |
          set -euo pipefail
          if grep -nE 'service_role|SUPABASE_SERVICE_ROLE|serviceRoleKey' app.js config.js index.html 2>/dev/null; then exit 1; fi
      - name: Validate commercial truth rules
        run: |
          set -euo pipefail
          grep -q 'revenue_requires_transaction' control-plane/policy.json
          grep -q 'outcome_requires_measurement' control-plane/policy.json
          grep -q 'verified_tool_requires_current_evidence' control-plane/policy.json
      - name: Validate customer revenue path configuration
        run: |
          set -euo pipefail
          grep -q 'from = "/app"' netlify.toml
          grep -q 'to = "/platform.html"' netlify.toml
          grep -q 'from = "/api/audit"' netlify.toml
          grep -q 'from = "/api/checkout"' netlify.toml
          test -s netlify/functions/checkout.mjs
          test -s netlify/functions/audit.mjs
          grep -q 'from = "/api/stripe-webhook"' netlify.toml
          grep -q 'from = "/api/entitlement"' netlify.toml
          grep -q 'from = "/api/iap-verify"' netlify.toml
          ! grep -q 'buy.stripe.com/' mobile/App.js
          grep -q 'expo-iap' mobile/package.json
          grep -q 'IAP_VERIFY_API' mobile/App.js
          test -s netlify/functions/iap-verify.mjs
          test -s supabase/migrations/202610080003_store_entitlements.sql
      - name: Enforce mobile audit single source of truth
        shell: bash
        run: |
          set -euo pipefail
          test -s mobile/session.js
          grep -q 'Authorization: "Bearer " + sessionToken' mobile/App.js
          grep -q 'AUDIT_API' mobile/App.js
          ! grep -q 'function makeAudit' mobile/App.js
          ! grep -q 'const rules = ' mobile/App.js
          grep -q 'AUTH_REQUIRED' netlify/functions/audit.mjs
          echo "MOBILE_AUDIT_SINGLE_SOURCE=PASS"

      - name: Enforce Auth UID tenant binding
        shell: bash
        run: |
          set -euo pipefail
          test -s supabase/migrations/202610080001_auth_tenant_binding.sql
          grep -q 'auth_user_id uuid not null unique' supabase/migrations/202610080001_auth_tenant_binding.sql
          grep -q 'aimpact_get_or_create_tenant' supabase/migrations/202610080001_auth_tenant_binding.sql
          grep -q 'auth/v1/user' netlify/functions/audit.mjs
          grep -q 'aimpact_get_or_create_tenant' netlify/functions/audit.mjs
          echo "AUTH_UID_TENANT_BINDING=PASS"

      - name: Enforce strict completion state machine
        shell: bash
        run: |
          set -euo pipefail
          test -s control-plane/gatekeeper.mjs
          grep -q 'NOT_VERIFIED_COMPLETE' control-plane/gatekeeper.mjs
          grep -q 'ALL_REQUIRED_GATES_PASS' control-plane/policy.json
          echo "STRICT_COMPLETION_GATE=PASS"

      - name: Validate deployment truth boundaries
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const audit = fs.readFileSync("netlify/functions/audit.mjs", "utf8");
          const entitlement = fs.readFileSync("netlify/functions/entitlement.mjs", "utf8");
          const webhook = fs.readFileSync("netlify/functions/stripe-webhook.mjs", "utf8");
          const mobile = fs.readFileSync("mobile/App.js", "utf8");
          const checkout = fs.readFileSync("netlify/functions/checkout.mjs", "utf8");
          if (!audit.trim()) throw new Error("audit.mjs is empty");
          if (!checkout.includes("STRIPE_SECRET_KEY")) throw new Error("server checkout secret boundary missing");
          if (!checkout.includes("client_reference_id")) throw new Error("checkout customer binding missing");
          if (!audit.includes("OPENAI_API_KEY")) throw new Error("server AI provider boundary missing");
          if (!audit.includes("AI_PROVIDER_NOT_CONFIGURED")) throw new Error("AI fail-closed boundary missing");
          if (!entitlement.trim()) throw new Error("entitlement.mjs is empty");
          if (!webhook.trim()) throw new Error("stripe-webhook.mjs is empty");
          if (!mobile.includes("verifyPaidEntitlement")) throw new Error("mobile paid entitlement verification missing");
          if (!mobile.includes("AUDIT_API")) throw new Error("mobile server audit integration missing");
          if (!mobile.includes("body?.report")) throw new Error("mobile server audit report gate missing");
          if (!mobile.includes("body?.verified")) throw new Error("mobile verified response gate missing");
          if (!mobile.includes("verified===true") && !mobile.includes("verified === true")) throw new Error("mobile verified truth comparison missing");
          if (!mobile.includes("expo-iap")) throw new Error("native store billing dependency missing");
          if (!fs.readFileSync("netlify/functions/iap-verify.mjs", "utf8").includes("APPLE_ISSUER_ID")) throw new Error("Apple verification boundary missing");
          if (!fs.readFileSync("netlify/functions/iap-verify.mjs", "utf8").includes("GOOGLE_SERVICE_ACCOUNT_EMAIL")) throw new Error("Google verification boundary missing");
          if (!fs.existsSync("supabase/migrations/202610080003_store_entitlements.sql")) throw new Error("store entitlement migration missing");
          if (!webhook.includes("payment_status")) throw new Error("webhook payment_status proof missing");
          if (!webhook.includes('=== "paid"')) throw new Error("webhook paid proof missing");
          console.log("DEPLOYMENT_TRUTH_BOUNDARIES=PASS");
          NODE


  mobile-autonomous-control:
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.name == 'AIMPACT Mobile Build' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout for GitHub CLI context
        uses: actions/checkout@v4
      - name: Evaluate mobile completion deterministically
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail
          JOBS="$(gh run view "$RUN_ID" --json jobs --jq '.jobs[] | [.name,.status,.conclusion] | @tsv')"
          echo "$JOBS"
          ANDROID_APK="$(printf '%s\n' "$JOBS" | awk -F '\t' '$1=="android-apk"{print $3}')"
          ANDROID_RUNTIME="$(printf '%s\n' "$JOBS" | awk -F '\t' '$1=="android-runtime"{print $3}')"
          IOS_SIMULATOR="$(printf '%s\n' "$JOBS" | awk -F '\t' '$1=="ios-simulator"{print $3}')"
          if [ "$RUN_CONCLUSION" = "success" ] && [ "$ANDROID_APK" = "success" ] && [ "$ANDROID_RUNTIME" = "success" ] && [ "$IOS_SIMULATOR" = "success" ]; then
            echo "MOBILE_BUILD_GATE=PASS"
            exit 0
          fi
          if [ "$RUN_ATTEMPT" -lt 2 ]; then gh run rerun "$RUN_ID" --failed; exit 0; fi
          exit 1

  dispatch-native-store-qa:
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.name == 'AIMPACT Mobile Build' && github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout main history for immutable release tag
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Verify all required mobile build jobs passed and pin exact source
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          JOBS="$(gh run view "$RUN_ID" --json jobs --jq '.jobs[] | [.name,.conclusion] | @tsv')"
          echo "$JOBS"
          for job in android-apk android-runtime ios-simulator mobile-release-gate; do
            result="$(printf '%s\n' "$JOBS" | awk -F '\t' -v name="$job" '$1==name{print $2}')"
            if [ "$result" != "success" ]; then
              echo "MOBILE_STORE_QA_BLOCKED=JOB_${job}_${result:-MISSING}"
              exit 1
            fi
          done
          git cat-file -e "$RUN_SHA^{commit}"
          git merge-base --is-ancestor "$RUN_SHA" origin/main || { echo "::error::MOBILE_BUILD_SHA_NOT_ON_MAIN"; exit 1; }
          RELEASE_REF="ci/mobile-$RUN_ID"
          EXISTING_TAG_SHA="$(git ls-remote origin "refs/tags/$RELEASE_REF" | awk 'NR==1{print $1}')"
          if [ -n "$EXISTING_TAG_SHA" ]; then
            test "$EXISTING_TAG_SHA" = "$RUN_SHA" || { echo "::error::IMMUTABLE_RELEASE_TAG_SHA_MISMATCH"; exit 1; }
          else
            git tag "$RELEASE_REF" "$RUN_SHA"
            git push origin "refs/tags/$RELEASE_REF"
          fi
          gh workflow run native-store-qa.yml --ref "$RELEASE_REF" -f mobile_run_id="$RUN_ID" -f mobile_head_sha="$RUN_SHA" -f source_ref="$RELEASE_REF"
          echo "NATIVE_STORE_QA_DISPATCH=PASS MOBILE_RUN_ID=$RUN_ID MOBILE_SHA=$RUN_SHA SOURCE_REF=$RELEASE_REF"

  mobile-autorepair:
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.name == 'AIMPACT Mobile Build' && github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Auto-repair Expo dependency alignment
        working-directory: mobile
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npx expo install --fix
      - name: Commit deterministic dependency repair
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- mobile/package.json mobile/package-lock.json; then
            echo "MOBILE_AUTOREPAIR=NO_CHANGE"
            exit 0
          fi
          git config user.name "AIMPACT Central Control"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/package.json mobile/package-lock.json
          git commit -m "fix: auto-align Expo mobile dependencies"
          git push origin HEAD:main
          echo "MOBILE_AUTOREPAIR=COMMITTED"

  payment-autonomous-control:
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.name == 'AIMPACT Payment Control' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout for GitHub CLI context
        uses: actions/checkout@v4
      - name: Evaluate payment control completion deterministically
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail
          JOBS="$(gh run view "$RUN_ID" --json jobs --jq '.jobs[] | [.name,.status,.conclusion] | @tsv')"
          echo "$JOBS"
          CODE_GATE="$(printf '%s\n' "$JOBS" | awk -F '\t' '$1=="payment-code-gate"{print $3}')"
          INTEGRATION_GATE="$(printf '%s\n' "$JOBS" | awk -F '\t' '$1=="stripe-integration-gate"{print $3}')"
          if [ "$CODE_GATE" = "success" ] && [ "$INTEGRATION_GATE" = "success" ] && [ "$RUN_CONCLUSION" = "success" ]; then
            echo "PAYMENT_CODE_AND_PROVIDER_GATE=PASS (provider mode is reported by the integration job; MOCK_ONLY is not payment integration proof)"
            exit 0
          fi
          if [ "$RUN_CONCLUSION" = "skipped" ] && [ "$CODE_GATE" = "skipped" ] && [ "$INTEGRATION_GATE" = "skipped" ]; then
            echo "::warning::PAYMENT_PROVIDER_GATE=NOT_RUN"
            echo "PAYMENT_E2E=NOT_VERIFIED"
            echo "PAYMENT_AUTORETRY=NOT_APPLICABLE"
            exit 0
          fi
          if [ "$CODE_GATE" = "success" ] && [ "$INTEGRATION_GATE" = "failure" ]; then
            echo "PAYMENT_AUTOMATION_BLOCKED=SELECTED_PROVIDER_SECRET_OR_INTEGRATION_CONFIGURATION"
            echo "PAYMENT_AUTORETRY=SKIPPED_EXTERNAL_BLOCKER"
            exit 1
          fi
          if [ "$RUN_ATTEMPT" -lt 2 ]; then gh run rerun "$RUN_ID" --failed; exit 0; fi
          exit 1

  commercial-e2e-observation:
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.name == 'AIMPACT Payment Control' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Observe payment verification boundary
        env:
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail
          echo "PAYMENT_CONTROL_CONCLUSION=$RUN_CONCLUSION"
          echo "PAYMENT_E2E_MODE=OBSERVE_ONLY"
          echo "PAYMENT_E2E_RULE=never_fake_paid_state"
          echo "PAYMENT_E2E_NEXT=await_verified_checkout_entitlement"
