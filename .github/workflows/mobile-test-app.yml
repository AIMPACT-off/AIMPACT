name: AIMPACT Prelaunch Test App

on:
  push:
    branches: [feat/aimpact-prelaunch-test-app]
  pull_request:
    branches: [main]
    paths:
      - "mobile/**"
      - "tests/mobile-test-app.test.mjs"
      - ".github/workflows/mobile-test-app.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aimpact-test-app-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  android-test-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      APP_VARIANT: test
      EXPO_PUBLIC_APP_VARIANT: test
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package.json
      - name: Install mobile dependencies
        run: npm install
      - name: Verify test-app configuration
        env:
          APP_VARIANT: test
        run: |
          set -euo pipefail
          npx expo config --type public --json > /tmp/aimpact-test-config.json 2>/tmp/aimpact-expo-config.log
          node -e 'const c=JSON.parse(require("node:fs").readFileSync("/tmp/aimpact-test-config.json","utf8")); if(c.name!=="AIMPACT TEST"||c.android?.package!=="ai.aimpact.app.test"||c.ios?.bundleIdentifier!=="ai.aimpact.app.test"||c.extra?.isTestBuild!==true) process.exit(1); console.log("TEST_APP_CONFIG=PASS")'
      - name: Run test-app configuration contract tests
        working-directory: .
        run: node --test tests/mobile-test-app.test.mjs
      - name: Expo Doctor
        run: npx expo-doctor
      - name: Export Android bundle
        env:
          APP_VARIANT: test
        run: npx expo export --platform android --output-dir .expo-test-export --clear
      - name: Generate isolated Android native project
        env:
          APP_VARIANT: test
        run: npx expo prebuild --platform android --non-interactive --clean
      - name: Build installable test APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon
      - name: Verify test APK identity and checksum
        working-directory: mobile
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/Android/Sdk}}"
          AAPT="$(find "$SDK_ROOT/build-tools" -maxdepth 2 -type f -name aapt -print 2>/dev/null | sort -V | tail -n 1)"
          if [[ -z "$AAPT" ]]; then
            AAPT="$(command -v aapt || true)"
          fi
          test -n "$AAPT" && test -x "$AAPT"
          "$AAPT" dump badging "$APK" | grep -F "package: name='ai.aimpact.app.test'"
          (cd "$(dirname "$APK")" && sha256sum "$(basename "$APK")" > "$(basename "$APK").sha256" && sha256sum -c "$(basename "$APK").sha256")
          echo "AIMPACT_TEST_APP_BUILD=PASS"
          echo "ANDROID_TEST_APK=$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: AIMPACT-TEST-Android-APK
          path: |
            mobile/android/app/build/outputs/apk/release/app-release.apk
            mobile/android/app/build/outputs/apk/release/app-release.apk.sha256
          if-no-files-found: error

  ios-test-simulator:
    runs-on: macos-15
    timeout-minutes: 35
    env:
      APP_VARIANT: test
      EXPO_PUBLIC_APP_VARIANT: test
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package.json
      - name: Install mobile dependencies
        run: npm install
      - name: Verify test-app configuration
        env:
          APP_VARIANT: test
        run: |
          set -euo pipefail
          npx expo config --type public --json > /tmp/aimpact-test-config.json 2>/tmp/aimpact-expo-config.log
          node -e 'const c=JSON.parse(require("node:fs").readFileSync("/tmp/aimpact-test-config.json","utf8")); if(c.name!=="AIMPACT TEST"||c.ios?.bundleIdentifier!=="ai.aimpact.app.test"||c.extra?.isTestBuild!==true) process.exit(1); console.log("IOS_TEST_APP_CONFIG=PASS")'
      - name: Expo Doctor
        run: npx expo-doctor
      - name: Export iOS bundle
        env:
          APP_VARIANT: test
        run: npx expo export --platform ios --output-dir .expo-test-export-ios --clear
      - name: Generate isolated iOS native project
        env:
          APP_VARIANT: test
        run: npx expo prebuild --platform ios --non-interactive --clean
      - name: Install CocoaPods dependencies
        run: pod install --project-directory=ios
      - name: Build, install, and launch test app on simulator
        env:
          APP_VARIANT: test
        run: |
          set -euo pipefail
          WORKSPACE=$(find ios -maxdepth 1 -name "*.xcworkspace" -print -quit)
          test -n "$WORKSPACE"
          SCHEME=$(xcodebuild -list -json -workspace "$WORKSPACE" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d["workspace"]["schemes"][0])')
          xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Release -sdk iphonesimulator -derivedDataPath ios/build CODE_SIGNING_ALLOWED=NO build
          APP_PATH=$(find ios/build/Build/Products -type d -name "*.app" -path "*iphonesimulator*" -print -quit)
          test -n "$APP_PATH"
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP_PATH/Info.plist")
          test "$BUNDLE_ID" = "ai.aimpact.app.test"
          DEVICE=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for v in d["devices"].values() for x in v if x.get("isAvailable") and "iPhone" in x["name"]))')
          xcrun simctl boot "$DEVICE" 2>/dev/null || true
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" "$APP_PATH"
          xcrun simctl launch "$DEVICE" ai.aimpact.app.test
          sleep 8
          xcrun simctl get_app_container "$DEVICE" ai.aimpact.app.test app >/dev/null
          echo "IOS_TEST_APP_RUNTIME=PASS"
          echo "AIMPACT_TEST_APP_BUILD=PASS"
      - uses: actions/upload-artifact@v4
        with:
          name: AIMPACT-TEST-iOS-Simulator
          path: mobile/ios/build/Build/Products
          if-no-files-found: error
