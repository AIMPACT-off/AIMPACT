name: Disposable Supabase migration test
on:
  pull_request:
    paths: ["supabase/**", ".github/workflows/db-migration-test.yml"]
  push:
    paths: ["supabase/**", ".github/workflows/db-migration-test.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  migration-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Initialize local config when absent
        run: |
          if [ ! -f supabase/config.toml ]; then supabase init; fi
      - name: Start disposable local stack
        run: supabase start --exclude studio,edge-runtime,logflare,vector,analytics,supavisor,imgproxy,inbucket,storage-api,rest,realtime,auth
      - name: Apply all migrations from clean database
        run: supabase db reset
      - name: Verify audit chain objects
        run: supabase db query --local "select to_regclass('public.audit_logs'), to_regprocedure('public.verify_audit_log_chain()'), to_regprocedure('public.aimpact_renew_execution_lock(text,uuid,integer)'), to_regprocedure('public.aimpact_claim_execution_lock(text,uuid,integer)');"
      - name: Exercise rollback in disposable database
        run: supabase db query --local --file supabase/rollback/202610020002_audit_hash_chain.rollback.sql
      - name: Re-apply migrations from clean state
        run: supabase db reset
      - name: Stop local stack
        if: always()
        run: supabase stop --no-backup
