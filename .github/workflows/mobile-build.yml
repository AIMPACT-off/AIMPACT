name: AIMPACT Mobile Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  android-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package.json

      - name: Install dependencies
        run: npm install

      - name: Validate Expo project
        run: npx expo config --type public

      - name: Generate native Android project
        run: npx expo prebuild --platform android --non-interactive

      - name: Build installable Android APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Verify APK
        working-directory: mobile
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          echo "APK_READY=$APK"
          ls -lh "$APK"

      - name: Upload AIMPACT Android APK
        uses: actions/upload-artifact@v4
        with:
          name: AIMPACT-Android-APK
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
