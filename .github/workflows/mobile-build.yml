name: AIMPACT Mobile Build

on:
  push:
    branches:
      - main
      - autonomous/core-product-audit
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: aimpact-mobile-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package.json
      - name: Install dependencies
        run: npm install
      - name: Validate Expo project
        run: npx expo config --type public
      - name: Expo Doctor
        run: npx expo-doctor
      - name: Validate Android JavaScript bundle
        run: npx expo export --platform android --output-dir .expo-export --clear
      - name: Generate native Android project
        run: npx expo prebuild --platform android --non-interactive
      - name: Build installable Android APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon
      - name: Verify APK
        working-directory: mobile
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          (cd "$(dirname "$APK")" && sha256sum "$(basename "$APK")" > "$(basename "$APK").sha256")
          cat "$APK.sha256"
          echo "APK_READY=$APK"
          ls -lh "$APK" "$APK.sha256"
      - name: Upload AIMPACT Android APK
        uses: actions/upload-artifact@v4
        with:
          name: AIMPACT-Android-APK
          path: |
            mobile/android/app/build/outputs/apk/release/app-release.apk
            mobile/android/app/build/outputs/apk/release/app-release.apk.sha256
          if-no-files-found: error

  android-runtime:
    needs: android-apk
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download exact APK artifact from android-apk job
        uses: actions/download-artifact@v4
        with:
          name: AIMPACT-Android-APK
          path: mobile/android/app/build/outputs/apk/release/
      - name: Verify downloaded APK checksum
        shell: bash
        run: |
          set -euo pipefail
          APK="mobile/android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          test -s "$APK.sha256"
          (
            cd "$(dirname "$APK")"
            sha256sum -c "$(basename "$APK").sha256"
            echo "ANDROID_RUNTIME_ARTIFACT_SHA256=$(sha256sum "$(basename "$APK")" | awk '{print $1}')"
          )
      - name: Prepare Linux KVM for Android Emulator
        shell: bash
        run: |
          set -euo pipefail
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            echo "KVM_DEVICE=/dev/kvm"
            ls -l /dev/kvm
          else
            echo "KVM_DEVICE=ABSENT"
          fi

      - name: Launch AIMPACT on Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          emulator-boot-timeout: 600
          force-avd-creation: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: false
          script: |
            bash mobile/scripts/android-runtime-check.sh
      - name: Upload Android runtime diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: AIMPACT-Android-Runtime-Diagnostics
          path: mobile/artifacts/android-runtime/
          if-no-files-found: warn

  ios-simulator:
    runs-on: macos-15
    timeout-minutes: 25
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package.json
      - name: Install dependencies
        run: npm install
      - name: Validate Expo project
        run: npx expo config --type public
      - name: Expo Doctor
        run: npx expo-doctor
      - name: Validate iOS JavaScript bundle
        run: npx expo export --platform ios --output-dir .expo-export-ios --clear
      - name: Generate native iOS project
        run: npx expo prebuild --platform ios --non-interactive
      - name: Install CocoaPods dependencies
        run: pod install --project-directory=ios
      - name: Select available iOS Simulator
        run: |
          python3 - <<'PY' > /tmp/ios-sim.env
          import json, subprocess
          data = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "--json"]))
          found = [(d.get("name"), d.get("udid")) for devices in data["devices"].values() for d in devices if d.get("isAvailable") and "iPhone" in d.get("name", "")]
          if not found:
              raise SystemExit("No available iPhone simulator found")
          name, udid = found[0]
          print(f"IOS_SIMULATOR_NAME={name}")
          print(f"IOS_SIMULATOR_UDID={udid}")
          PY
          cat /tmp/ios-sim.env >> "$GITHUB_ENV"
          cat /tmp/ios-sim.env
      - name: Boot selected iOS Simulator
        run: |
          xcrun simctl boot "$IOS_SIMULATOR_UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$IOS_SIMULATOR_UDID" -b
          xcrun simctl list devices | grep "$IOS_SIMULATOR_UDID"
      - name: Build iOS Simulator app
        run: |
          WORKSPACE=$(find ios -maxdepth 1 -name "*.xcworkspace" -print -quit)
          test -n "$WORKSPACE"
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Release -sdk iphonesimulator -derivedDataPath ios/build -destination "platform=iOS Simulator,id=$IOS_SIMULATOR_UDID" CODE_SIGNING_ALLOWED=NO build
      - name: Launch AIMPACT on iOS Simulator
        run: |
          APP_PATH=$(find ios/build/Build/Products -type d -name "AIMPACT.app" -print -quit)
          test -n "$APP_PATH"
          echo "APP_PATH=$APP_PATH"
          xcrun simctl boot "$IOS_SIMULATOR_UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$IOS_SIMULATOR_UDID" -b
          xcrun simctl install "$IOS_SIMULATOR_UDID" "$APP_PATH"
          echo "INSTALL=PASS"
          set +e
          LAUNCH_OUTPUT=$(xcrun simctl launch "$IOS_SIMULATOR_UDID" "ai.aimpact.app" 2>&1)
          LAUNCH_STATUS=$?
          set -e
          echo "LAUNCH_STATUS=$LAUNCH_STATUS"
          echo "$LAUNCH_OUTPUT"
          xcrun simctl listapps "$IOS_SIMULATOR_UDID" | grep -A 8 -B 2 "ai.aimpact.app" || true
          sleep 12
          echo "RECENT_APP_LOGS="
          xcrun simctl spawn "$IOS_SIMULATOR_UDID" log show --last 2m --style compact --predicate 'process == "AIMPACT" OR eventMessage CONTAINS[c] "ai.aimpact.app"' | tail -n 200 || true
          test "$LAUNCH_STATUS" = "0"
          xcrun simctl get_app_container "$IOS_SIMULATOR_UDID" "ai.aimpact.app" app >/dev/null
          echo "AIMPACT_IOS_RUNTIME=PASS"
      - name: Upload iOS simulator artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIMPACT-iOS-Simulator
          path: mobile/ios/build/Build/Products
          if-no-files-found: error

  mobile-release-gate:
    needs:
      - android-apk
      - android-runtime
      - ios-simulator
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Enforce mobile release gate
        env:
          ANDROID_BUILD: ${{ needs.android-apk.result }}
          ANDROID_RUNTIME: ${{ needs.android-runtime.result }}
          IOS_RUNTIME: ${{ needs.ios-simulator.result }}
        run: |
          echo "ANDROID_BUILD=$ANDROID_BUILD"
          echo "ANDROID_RUNTIME=$ANDROID_RUNTIME"
          echo "IOS_RUNTIME=$IOS_RUNTIME"
          test "$ANDROID_BUILD" = "success"
          test "$ANDROID_RUNTIME" = "success"
          test "$IOS_RUNTIME" = "success"
          echo "AIMPACT_MOBILE_RELEASE_GATE=PASS"

