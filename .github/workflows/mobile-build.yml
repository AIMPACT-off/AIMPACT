name: AIMPACT Mobile Build

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      platform:
        description: "Build platform"
        required: true
        default: "android"
        type: choice
        options:
          - android
          - ios
          - all
      profile:
        description: "EAS build profile"
        required: true
        default: "preview"
        type: choice
        options:
          - preview
          - production

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mobile-app-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package.json
      - name: Install dependencies
        run: npm install
      - name: Validate Expo project
        run: npx expo config --type public
      - name: Verify Expo authentication
        run: |
          echo "Event: $GITHUB_EVENT_NAME"
          echo "Ref: $GITHUB_REF"
          echo "Actor: $GITHUB_ACTOR"
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN injection failed."
            exit 1
          fi
          echo "EXPO_TOKEN injection detected."
          npx eas-cli whoami --non-interactive
      - name: Build mobile app
        run: npx eas-cli build --platform ${{ inputs.platform || 'android' }} --profile ${{ inputs.profile || 'preview' }} --non-interactive
