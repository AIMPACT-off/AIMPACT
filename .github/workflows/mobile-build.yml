name: AIMPACT Mobile Build

on:
  push:
    branches:
      - main
      - autonomous/core-product-audit
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  android-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package.json
      - name: Install dependencies
        run: npm install
      - name: Validate Expo project
        run: npx expo config --type public
      - name: Expo Doctor
        run: npx expo-doctor
      - name: Validate Android JavaScript bundle
        run: npx expo export --platform android --output-dir .expo-export --clear
      - name: Generate native Android project
        run: npx expo prebuild --platform android --non-interactive
      - name: Build installable Android APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon
      - name: Verify APK
        working-directory: mobile
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          echo "APK_READY=$APK"
          ls -lh "$APK"
      - name: Upload AIMPACT Android APK
        uses: actions/upload-artifact@v4
        with:
          name: AIMPACT-Android-APK
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  android-runtime:
    needs: android-apk
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package.json
      - name: Install dependencies
        run: npm install
        working-directory: mobile
      - name: Generate native Android project
        run: npx expo prebuild --platform android --non-interactive
        working-directory: mobile
      - name: Build APK for runtime
        run: ./gradlew assembleRelease --no-daemon
        working-directory: mobile/android
      - name: Launch AIMPACT on Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: |
            adb install -r mobile/android/app/build/outputs/apk/release/app-release.apk
            adb shell am force-stop ai.aimpact.app
            adb shell monkey -p ai.aimpact.app 1
            sleep 15
            adb shell pidof ai.aimpact.app
            adb shell dumpsys activity activities | grep -q "ai.aimpact.app"
            if adb logcat -d | grep -E "FATAL EXCEPTION|Process: ai.aimpact.app" | tail -100 | grep -q "FATAL EXCEPTION"; then
              echo "AIMPACT_RUNTIME_CRASH=1"
              exit 1
            fi
            echo "AIMPACT_RUNTIME=PASS"

  ios-simulator:
    runs-on: macos-15
    timeout-minutes: 25
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package.json
      - name: Install dependencies
        run: npm install
      - name: Validate Expo project
        run: npx expo config --type public
      - name: Expo Doctor
        run: npx expo-doctor
      - name: Validate iOS JavaScript bundle
        run: npx expo export --platform ios --output-dir .expo-export-ios --clear
      - name: Generate native iOS project
        run: npx expo prebuild --platform ios --non-interactive
      - name: Install CocoaPods dependencies
        run: pod install --project-directory=ios
      - name: Build iOS Simulator app
        run: |
          WORKSPACE=$(find ios -maxdepth 1 -name "*.xcworkspace" -print -quit)
          test -n "$WORKSPACE"
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Debug -sdk iphonesimulator -derivedDataPath ios/build -destination "platform=iOS Simulator,name=iPhone 17,OS=latest" CODE_SIGNING_ALLOWED=NO build
      - name: Launch AIMPACT on iOS Simulator
        run: |
          PROJECT=$(find ios -maxdepth 1 -name "*.xcodeproj" -print -quit)
          SCHEME=$(basename "$PROJECT" .xcodeproj)
          APP_PATH=$(find ios/build/Build/Products -type d -name "$SCHEME.app" -print -quit)
          test -n "$APP_PATH"
          xcrun simctl boot "iPhone 17" 2>/dev/null || true
          xcrun simctl bootstatus "iPhone 17" -b
          xcrun simctl install "iPhone 17" "$APP_PATH"
          LAUNCH_OUTPUT=$(xcrun simctl launch "iPhone 17" "ai.aimpact.app")
          echo "$LAUNCH_OUTPUT"
          PID=$(echo "$LAUNCH_OUTPUT" | awk '{print $NF}')
          test -n "$PID"
          sleep 12
          xcrun simctl spawn "iPhone 17" ps -p "$PID" | grep -q "$PID"
          xcrun simctl listapps "iPhone 17" | grep -q "ai.aimpact.app"
          echo "AIMPACT_IOS_RUNTIME=PASS"
      - name: Upload iOS simulator artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIMPACT-iOS-Simulator
          path: mobile/ios/build/Build/Products
          if-no-files-found: error

  mobile-release-gate:
    needs:
      - android-apk
      - android-runtime
      - ios-simulator
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Enforce mobile release gate
        env:
          ANDROID_BUILD: ${{ needs.android-apk.result }}
          ANDROID_RUNTIME: ${{ needs.android-runtime.result }}
          IOS_RUNTIME: ${{ needs.ios-simulator.result }}
        run: |
          echo "ANDROID_BUILD=$ANDROID_BUILD"
          echo "ANDROID_RUNTIME=$ANDROID_RUNTIME"
          echo "IOS_RUNTIME=$IOS_RUNTIME"
          test "$ANDROID_BUILD" = "success"
          test "$ANDROID_RUNTIME" = "success"
          test "$IOS_RUNTIME" = "success"
          echo "AIMPACT_MOBILE_RELEASE_GATE=PASS"
