name: AIMPACT Mobile Build

on:
  push:
    branches:
      - main
      - autonomous/core-product-audit
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  android-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package.json

      - name: Install dependencies
        run: npm install

      - name: Validate Expo project
        run: npx expo config --type public

      - name: Expo Doctor
        run: npx expo-doctor

      - name: Validate Android JavaScript bundle
        run: npx expo export --platform android --output-dir .expo-export --clear

      - name: Generate native Android project
        run: npx expo prebuild --platform android --non-interactive

      - name: Build installable Android APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Verify APK
        working-directory: mobile
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          echo "APK_READY=$APK"
          ls -lh "$APK"

      - name: Upload AIMPACT Android APK
        uses: actions/upload-artifact@v4
        with:
          name: AIMPACT-Android-APK
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  android-runtime:
    needs: android-apk
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package.json

      - name: Install dependencies
        run: npm install
        working-directory: mobile

      - name: Generate native Android project
        run: npx expo prebuild --platform android --non-interactive
        working-directory: mobile

      - name: Build APK for runtime
        run: ./gradlew assembleDebug --no-daemon
        working-directory: mobile/android

      - name: Launch AIMPACT on Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: |
            adb install -r mobile/android/app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop ai.aimpact.app
            adb shell monkey -p ai.aimpact.app 1
            sleep 12
            adb shell pidof ai.aimpact.app
            adb shell dumpsys activity activities | grep -q "ai.aimpact.app"
            if adb logcat -d | grep -E "FATAL EXCEPTION|Process: ai.aimpact.app" | tail -50 | grep -q "FATAL EXCEPTION"; then
              echo "AIMPACT_RUNTIME_CRASH=1"
              exit 1
            fi
            echo "AIMPACT_RUNTIME=PASS"
