name: Tenant isolation tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/test-tenant-isolation.mjs"
      - ".github/workflows/tenant-isolation.yml"

jobs:
  rls-negative-tests:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      TENANT_A_JWT: ${{ secrets.TENANT_A_JWT }}
      RLS_TEST_CASES: ${{ secrets.RLS_TEST_CASES }}
    steps:
      - name: Require test credentials
        if: env.SUPABASE_URL == '' || env.SUPABASE_ANON_KEY == '' || env.TENANT_A_JWT == '' || env.RLS_TEST_CASES == ''
        run: |
          echo "::warning::RLS test secrets are incomplete; tests cannot run."
          exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run cross-tenant negative tests
        run: node scripts/test-tenant-isolation.mjs
