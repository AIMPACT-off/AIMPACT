name: AIMPACT Store Credential Recovery

'on':
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: aimpact-store-credential-recovery
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  recover-store-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout release workflow context
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Detect required store credentials without exposing values
        id: credentials
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          APPLE_ISSUER_ID: ${{ secrets.APPLE_ISSUER_ID }}
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APPLE_PRIVATE_KEY: ${{ secrets.APPLE_PRIVATE_KEY }}
          APPLE_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_PRIVATE_KEY_BASE64 }}
          APPLE_BUNDLE_ID: ${{ secrets.APPLE_BUNDLE_ID }}
          GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
          GOOGLE_SERVICE_ACCOUNT_KEY_BASE64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY_BASE64 }}
          GOOGLE_PACKAGE_NAME: ${{ secrets.GOOGLE_PACKAGE_NAME }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for name in EXPO_TOKEN APPLE_ISSUER_ID APPLE_KEY_ID APPLE_BUNDLE_ID GOOGLE_SERVICE_ACCOUNT_EMAIL GOOGLE_SERVICE_ACCOUNT_KEY_BASE64 GOOGLE_PACKAGE_NAME; do
            if [ -z "${!name:-}" ]; then missing+=("$name"); fi
          done
          if [ -z "${APPLE_PRIVATE_KEY:-}" ] && [ -z "${APPLE_PRIVATE_KEY_BASE64:-}" ]; then
            missing+=("APPLE_PRIVATE_KEY_OR_APPLE_PRIVATE_KEY_BASE64")
          fi
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "STORE_CREDENTIALS=INCOMPLETE"
            printf 'MISSING_CREDENTIAL_NAMES=%s\n' "$(IFS=,; echo "${missing[*]}")"
            exit 0
          fi
          echo "STORE_CREDENTIALS=CONFIGURED"
          # Recover only a QA run that explicitly failed at the missing-credentials gate.
          # Never rerun arbitrary build, signing, provenance, or provider failures.
          latest_mobile="$(gh run list --workflow "AIMPACT Mobile Build" --branch main --status success --limit 1 --json databaseId,headSha,headBranch,createdAt)"
          mobile_run_id="$(printf '%s' "$latest_mobile" | jq -r '.[0].databaseId // empty')"
          mobile_sha="$(printf '%s' "$latest_mobile" | jq -r '.[0].headSha // empty')"
          if [ -z "$mobile_run_id" ] || [ -z "$mobile_sha" ]; then
            echo "STORE_QA_RECOVERY=BLOCKED_NO_SUCCESSFUL_MAIN_MOBILE_BUILD"
            exit 0
          fi
          release_ref="ci/mobile-$mobile_run_id"
          if ! git ls-remote --exit-code --tags origin "refs/tags/$release_ref" >/dev/null 2>&1; then
            echo "STORE_QA_RECOVERY=BLOCKED_IMMUTABLE_RELEASE_TAG_MISSING"
            echo "MOBILE_RUN_ID=$mobile_run_id MOBILE_SHA=$mobile_sha"
            exit 0
          fi
          qa_runs="$(gh run list --workflow native-store-qa.yml --branch "$release_ref" --limit 10 --json databaseId,status,conclusion,headSha)"
          active="$(printf '%s' "$qa_runs" | jq '[.[] | select(.status == "in_progress" or .status == "queued")] | length')"
          if [ "$active" -gt 0 ]; then
            echo "STORE_QA_RECOVERY=SKIPPED_ALREADY_ACTIVE"
            exit 0
          fi
          failed_qa="$(printf '%s' "$qa_runs" | jq -r '[.[] | select(.conclusion == "failure")][0].databaseId // empty')"
          successful_qa="$(printf '%s' "$qa_runs" | jq -r '[.[] | select(.conclusion == "success")][0].databaseId // empty')"
          if [ -n "$successful_qa" ]; then
            echo "STORE_QA_RECOVERY=SKIPPED_QA_ALREADY_PASSED RUN=$successful_qa"
            exit 0
          fi
          if [ -z "$failed_qa" ]; then
            echo "STORE_QA_RECOVERY=SKIPPED_NO_CREDENTIAL_GATE_FAILURE"
            exit 0
          fi
          failure_log="$(gh run view "$failed_qa" --log 2>/dev/null || true)"
          if ! printf '%s' "$failure_log" | grep -q 'STORE_RELEASE_BLOCKED_CREDENTIALS'; then
            echo "STORE_QA_RECOVERY=SKIPPED_FAILURE_NOT_CREDENTIAL_GATE RUN=$failed_qa"
            exit 0
          fi
          gh workflow run native-store-qa.yml --ref "$release_ref" \
            -f mobile_run_id="$mobile_run_id" \
            -f mobile_head_sha="$mobile_sha" \
            -f source_ref="$release_ref"
          echo "STORE_QA_RECOVERY=DISPATCHED"
          echo "SOURCE_REF=$release_ref MOBILE_RUN_ID=$mobile_run_id MOBILE_SHA=$mobile_sha PRIOR_QA_RUN=$failed_qa"
