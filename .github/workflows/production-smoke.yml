name: AIMPACT production smoke

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: node --check app.js
      - name: Required production hooks
        run: |
          test -s index.html
          test -s app.js
          test -s config.js
          grep -q 'public_tools' app.js
          grep -q 'workflows' app.js
          grep -q 'events' app.js
          grep -q 'leads' app.js
          grep -q 'id="applyForm"' index.html
          grep -q 'id="leadForm"' index.html
      - name: Production HTTP smoke
        run: |
          code=$(curl -L -s -o /tmp/aimpact.html -w "%{http_code}" --max-time 20 https://aimpact-ai.netlify.app/)
          test "$code" -ge 200
          test "$code" -lt 400
          grep -q 'AIMPACT' /tmp/aimpact.html
