<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AIMPACT · Payment Verification</title>
<style>body{margin:0;background:#08090b;color:#f5f6f7;font:14px system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;padding:22px}.card{width:min(100%,520px);padding:26px;background:#101216;border:1px solid #292c33;border-radius:14px}.tag{font-size:9px;letter-spacing:.18em;color:#9298a3;font-weight:800}.title{font-size:30px;letter-spacing:-.04em}.muted{color:#9298a3;line-height:1.6;font-size:12px}.notice{margin-top:18px;padding:14px;border:1px solid #343842;border-radius:8px;white-space:pre-wrap;line-height:1.6}.btn{display:inline-block;margin-top:20px;color:#08090b;background:#fff;padding:12px 16px;border-radius:7px;text-decoration:none;font-size:10px;font-weight:900}</style></head>
<body><main class="card"><div class="tag">AIMPACT · PAYMENT VERIFICATION</div><h1 class="title">결제 승인 검증 중</h1><p class="muted">브라우저의 성공 리디렉션만으로는 유료 권한을 부여하지 않습니다. 서버가 토스 결제 승인과 원장 기록을 검증합니다.</p><div id="notice" class="notice">서버 검증을 시작합니다…</div><a class="btn" href="/app">AIMPACT로 돌아가기</a></main>
<script>
(async()=>{
 const n=document.getElementById("notice");
 const p=new URLSearchParams(location.search);
 const paymentKey=p.get("paymentKey")||"";
 const orderId=p.get("orderId")||"";
 const amount=Number(p.get("amount"));
 const token=sessionStorage.getItem("aimpact_access_token")||"";
 if(!paymentKey||!orderId||!Number.isSafeInteger(amount)){n.textContent="결제 참조값이 유효하지 않습니다. 권한은 부여되지 않았습니다.";return;}
 if(!token){n.textContent="고객 인증 세션을 찾을 수 없습니다. 결제는 완료되었을 수 있지만 권한 검증은 완료되지 않았습니다. 고객지원에 주문번호 "+orderId+"를 전달해 주세요.";return;}
 try{
  const r=await fetch("/api/toss-confirm",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+token},body:JSON.stringify({paymentKey,orderId,amount})});
  const d=await r.json().catch(()=>({}));
  if(!r.ok||d.verified!==true){n.textContent="결제 권한 검증 실패: "+(d.error||"VERIFICATION_FAILED")+"\n유료 기능은 잠긴 상태로 유지됩니다.";return;}
  n.textContent="결제 승인 및 권한 원장 기록 검증 완료.\n상품: AI Quick Audit\n주문번호: "+orderId+"\n금액: ₩"+amount.toLocaleString("ko-KR")+"\n상태: VERIFIED";
 }catch(e){n.textContent="검증 서버에 연결하지 못했습니다. 권한은 잠긴 상태로 유지됩니다. 주문번호: "+orderId;}
})();
</script></body></html>
