<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AIMPACT Payment Confirmation</title><style>body{margin:0;background:#070809;color:#f6f7f8;font:16px system-ui;padding:48px}.box{max-width:680px;margin:auto;border:1px solid #292d34;background:#101215;border-radius:12px;padding:28px}.muted{color:#9299a5;line-height:1.6}.ok{font-size:32px;font-weight:800}button{background:#fff;color:#070809;border:0;padding:12px 16px;border-radius:7px;cursor:pointer}</style></head><body><main class="box"><div class="ok" id="title">VERIFYING PAYMENT…</div><p class="muted" id="msg">AIMPACT is verifying the payment with Toss Payments. A successful browser redirect is not treated as payment success until server-side confirmation completes.</p><button onclick="location.href='/app'">RETURN TO AIMPACT</button></main><script>
(async()=>{const q=new URLSearchParams(location.search),paymentKey=q.get("paymentKey"),orderId=q.get("orderId"),amount=Number(q.get("amount")||0);if(!paymentKey||!orderId){title.textContent="PAYMENT DATA MISSING";msg.textContent="No payment confirmation data was received.";return}try{const r=await fetch("/.netlify/functions/toss-confirm",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({paymentKey,orderId,amount})});const d=await r.json();if(r.ok&&d.ok){title.textContent="PAYMENT SUCCEEDED · ₩200,000";msg.textContent="Server-side confirmation succeeded. AIMPACT can now treat this order as PAYMENT_SUCCEEDED. PaymentKey: "+d.payment.paymentKey;localStorage.setItem("aimpact_payment_succeeded",JSON.stringify({orderId,paymentKey:d.payment.paymentKey,amount:d.payment.totalAmount,status:d.payment.status,at:new Date().toISOString()}));}else{title.textContent="PAYMENT CONFIRMATION FAILED";msg.textContent=(d.error||"CONFIRM_FAILED")+" · "+(d.message||"");}}catch(e){title.textContent="PAYMENT VERIFICATION ERROR";msg.textContent=e.message||"UNKNOWN_ERROR"}})();
</script></body></html>
